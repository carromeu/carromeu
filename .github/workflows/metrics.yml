# Gera as métricas do perfil com lowlighter/metrics (GitHub Action) e commita o SVG neste repositório.
# Diferente do github-readme-stats público (instância na Vercel, hoje em 503), não depende de serviço externo
# e soma contribuições em repositórios de organizações (embrapa-io etc.), não só nos repositórios próprios.
name: Métricas do perfil

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 em Campo Grande
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico do token (escopos e alcance, sem expor o valor)
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "tipo: $([ -n "${{ secrets.METRICS_TOKEN }}" ] && echo METRICS_TOKEN || echo GITHUB_TOKEN)"
          echo "escopos (vazio = token fine-grained ou GITHUB_TOKEN): $(gh api -i user 2>/dev/null | grep -i '^x-oauth-scopes' || echo 'n/d')"
          echo "usuário: $(gh api user --jq .login 2>/dev/null || echo 'n/d')"
          echo "repositórios visíveis (owner+collaborator+organization_member): $(gh api 'user/repos?affiliation=owner,collaborator,organization_member&per_page=100' --paginate --jq 'length' 2>/dev/null | paste -sd+ - | bc)"
          echo "organizações visíveis: $(gh api user/orgs --jq '.[].login' 2>/dev/null | paste -sd, -)"
      - name: Métricas gerais (commits, repositórios, estrelas, linguagens)
        uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN: token pessoal (classic) com read:user, read:org e public_repo.
          # Sem ele, cai no GITHUB_TOKEN, que cobre menos dados.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: carromeu
          filename: github-metrics.svg
          template: classic
          config_timezone: America/Campo_Grande
          config_display: large
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          # conta repositórios próprios, em que colaboro e das organizações de que sou membro
          repositories_affiliations: owner, collaborator, organization_member
          commits_authoring: carromeu, camilo.carromeu@embrapa.br, camilo@carromeu.com
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used # 'recently-used' quebra no analisador do metrics (TypeError em recent.mjs)
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss
          # a análise em profundidade clona e varre cada repositório; limites no máximo permitido pelo metrics
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 0 # sem limite por repositório (o limite de 15 min por repositório gerava resultado parcial)
          debug: yes # temporário: identificar repositórios lentos na análise
          # repositórios pesados de dados, imagens e forks de terceiros, que não representam código meu
          plugin_languages_skipped: >-
            maykon1313/Embrapa, carromeu/awesome-idea-of-the-day-archive, carromeu/house,
            carromeu/obsidian-embrapa, liafacom/fauna_flora, liafacom/fauna_flora_bento,
            liafacom/fauna_flora_api, liafacom/deformconv, liafacom/eliton, liafacom/text_dataset,
            liafacom/mlm_finetuning, embrapa-io/site, smartsolos/mobile
          plugins_errors_fatal: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
